# ============================================
# PlotSure Docker Compose
# ============================================
# Supports local development and GitHub Codespaces
#
# Quick Start (Local):
# 1. Create .env.local (frontend) and backend/.env
# 2. Fill in your Supabase credentials
# 3. Run: docker-compose up --build
#
# GitHub Codespaces:
# - Environment variables are configured via Codespaces secrets
# - Ports 5173 (frontend) and 8000 (backend) auto-forward

services:
  # ----------------------------------------
  # Backend (FastAPI)
  # ----------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plotsure-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - plotsure-network
    profiles:
      - dev
      - full

  # ----------------------------------------
  # Frontend (React + Vite)
  # ----------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: plotsure-frontend
    ports:
      - "5173:5173"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - plotsure-network
    profiles:
      - dev
      - full

  # ----------------------------------------
  # Backend (Development - hot reload)
  # ----------------------------------------
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plotsure-backend-dev
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - plotsure-network
    profiles:
      - dev-only

  # ----------------------------------------
  # Frontend (Development - hot reload)
  # ----------------------------------------
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: plotsure-frontend-dev
    ports:
      - "5173:5173"
    env_file:
      - .env.local
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - plotsure-network
    profiles:
      - dev-only

# ----------------------------------------
# Networks
# ----------------------------------------
networks:
  plotsure-network:
    driver: bridge