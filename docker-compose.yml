# ============================================
# PlotSure Docker Compose
# ============================================
# Quick Start:
# 1. Copy .env.example to .env.local (frontend) and backend/.env
# 2. Fill in your Supabase credentials
# 3. Run: docker-compose up --build
version: "3.8"

services:
  # ----------------------------------------
  # Backend (FastAPI)
  # ----------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plotsure-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - plotsure-network

  # ----------------------------------------
  # Frontend (React + Vite)
  # ----------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: plotsure-frontend
    ports:
      - "5173:5173"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - plotsure-network

# ----------------------------------------
# Networks
# ----------------------------------------
networks:
  plotsure-network:
    driver: bridge