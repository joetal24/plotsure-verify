# ============================================
# PlotSure Docker Compose
# ============================================
# Supports local development and GitHub Codespaces
#
# Quick Start (Local):
# 1. Create .env.local (frontend) and backend/.env
# 2. Fill in your Supabase credentials
# 3. Run: docker-compose up --build
#
# GitHub Codespaces:
# - Environment variables are configured via Codespaces secrets
# - Ports 5173 (frontend) and 8000 (backend) auto-forward

services:
  # ----------------------------------------
  # Backend (FastAPI)
  # ----------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plotsure-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - plotsure-network

  # ----------------------------------------
  # Frontend (React + Vite)
  # ----------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
          - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
          - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
          - VITE_API_URL=${VITE_API_URL}
    container_name: plotsure-frontend
    ports:
      - "5173:5173"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - plotsure-network

  # ----------------------------------------
  # Backend (Development - hot reload)
  # ----------------------------------------
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plotsure-backend-dev
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - plotsure-network
    profiles:
      - dev-only

  # ----------------------------------------
  # Redpanda (Kafka-compatible event broker)
  # ----------------------------------------
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.3
    container_name: plotsure-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=redpanda:8082
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "9092:9092"
      - "8082:8082"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - plotsure-network
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

  # ----------------------------------------
  # Fraud Detection Worker (main consumer)
  # ----------------------------------------
  fraud-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plotsure-fraud-worker
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
    command: python -m app.workers.fraud_worker
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - plotsure-network
    profiles:
      - fraud-worker

  # ----------------------------------------
  # Dead Letter Queue Handler
  # ----------------------------------------
  dlq-handler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plotsure-dlq-handler
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
    command: python -m app.workers.dlq_handler
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - plotsure-network
    profiles:
      - fraud-worker

  # ----------------------------------------
  # Frontend (Development - hot reload)
  # ----------------------------------------
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: plotsure-frontend-dev
    ports:
      - "5173:5173"
    env_file:
      - .env.local
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - plotsure-network
    profiles:
      - dev-only

# ----------------------------------------
# Volumes
# ----------------------------------------
volumes:
  redpanda-data:

# ----------------------------------------
# Networks
# ----------------------------------------
networks:
  plotsure-network:
    driver: bridge